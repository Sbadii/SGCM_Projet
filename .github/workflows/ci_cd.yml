name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies (React)
        run: cd frontend && npm install
      - name: Install dependencies (Flask)
        run: pip install -r backend/requirements.txt

  tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Run unit tests
        run: pytest backend/tests

  quality-check:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run SonarQube scanner (optionnel)
        run: |
          sonar-scanner \
            -Dsonar.projectKey=YOUR_KEY \
            -Dsonar.sources=. \
            -Dsonar.host.url=https://your-sonarqube-url \
            -Dsonar.login=YOUR_TOKEN

  deploy-preprod:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to preproduction
        run: echo "Déploiement sur serveur de test"
